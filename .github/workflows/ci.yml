name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The MSRV the manifest declares, then current stable. Cargo's
        # MSRV-aware resolver picks different dependency versions for each, so
        # the floor entry proves the floor rather than just the code.
        rust: ['1.85', 'stable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
      # yoke-derive 0.8.3 (2026-09-15) calls the inherent `str::from_utf8`, stable
      # since 1.87, and declares no rust-version, so the MSRV-aware resolver cannot
      # steer around it. Drop the pin once a newer yoke-derive builds on 1.85.
      - if: matrix.rust == '1.85'
        run: cargo update -p yoke-derive --precise 0.8.2
      - run: cargo test --all-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      # The integration crate is a package of its own, so the root check does not
      # reach it. rustfmt needs no dependency resolution, which is what lets this
      # run while nothing satisfying its requirement is published yet; clippy
      # would need one, so it cannot be gated here at all.
      - run: cargo fmt --check --manifest-path integration/Cargo.toml
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # rustls is the default, so this is the only TLS backend a plain `cargo test`
  # never exercises.
  native-tls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --no-default-features --features native-tls
