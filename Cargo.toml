[package]
name = "vpndetection"
version = "6.4.0"
edition = "2024"
rust-version = "1.85"
description = "The official Rust client library for the VPNDetection API: anonymity detection covering VPNs, residential proxies, Tor nodes, hosting servers, CDNs and relays."
authors = ["VPNDetection <support@vpndetection.io>"]
license = "MIT"
readme = "README.md"
homepage = "https://vpndetection.io"
repository = "https://github.com/vpndetection-io/sdk-rust"
documentation = "https://docs.rs/vpndetection"
keywords = ["vpn", "proxy", "tor", "geoip", "ip"]
categories = ["api-bindings", "network-programming"]
exclude = ["/spec", "/scripts", "/.github", "/integration"]

[dependencies]
chrono = { version = "0.4.20", features = ["serde"] }
# 0.3.2 is past RUSTSEC-2020-0062; 0.3.31 is the lowest a lockfile resolves,
# since js-sys, through reqwest and chrono, needs it.
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
# The PKCE verifier's 32 bytes, from the system's secure random source.
getrandom = "0.4"
indexmap = "2"
ipnet = "2"
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query"] }
# 1.0.164 is the first serde_derive to take `#[serde(untagged)]` on a variant,
# which every vocabulary's `Other` is (measured 2026-11-16).
serde = { version = "1.0.164", features = ["derive"] }
serde_json = "1"
# Below 3.21.0, GHSA-7gcf-g7xr-8hxj (`KeyValueMap`, which this crate never uses)
# stays open: every release from 3.18.0 on needs Rust 1.88, past the 1.85 floor.
serde_with = { version = "3", default-features = false, features = ["macros", "std"] }
# The PKCE challenge, SHA-256 over the verifier.
sha2 = { version = "0.11", default-features = false }
# The generated wire models carry `format: uuid` fields, which the generator
# emits as `uuid::Uuid`. The idiomatic types keep those IDs as `String`, so this
# stays out of the crate's public surface.
uuid = { version = "1", features = ["serde"] }
tokio = { version = "1.53.3", features = ["fs", "io-util", "sync", "time"] }

[dev-dependencies]
# Already in the build through reqwest's form and query features. The OAuth
# tests decode each request body with it.
serde_urlencoded = "0.7"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "time"] }

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/default-tls"]

[package.metadata.docs.rs]
all-features = true
