[package]
name = "vpndetection"
version = "5.1.0"
edition = "2024"
rust-version = "1.85"
description = "The official Rust client library for the VPNDetection API: anonymity detection covering VPNs, residential proxies, Tor nodes, hosting servers, CDNs and relays."
authors = ["VPNDetection <support@vpndetection.io>"]
license = "MIT"
readme = "README.md"
homepage = "https://vpndetection.io"
repository = "https://github.com/vpndetection-io/sdk-rust"
documentation = "https://docs.rs/vpndetection"
keywords = ["vpn", "proxy", "tor", "geoip", "ip"]
categories = ["api-bindings", "network-programming"]
exclude = ["/spec", "/scripts", "/.github", "/integration"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
indexmap = "2"
ipnet = "2"
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", default-features = false, features = ["macros", "std"] }
# The generated wire models carry `format: uuid` fields, which the generator
# emits as `uuid::Uuid`. The idiomatic types keep those ids as `String`, so this
# stays out of the crate's public surface.
uuid = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["fs", "io-util", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls", "reqwest/rustls-native-certs"]
native-tls = ["reqwest/default-tls"]

[package.metadata.docs.rs]
all-features = true
